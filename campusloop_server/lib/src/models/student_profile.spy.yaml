class: StudentProfile
table: student_profile
fields:
  displayName: String
  email: String
  department: String?
  year: int?
  bio: String?
  studySubjects: List<String>
  interests: List<String>
  role: String?
  canCreateCommunity: bool?
  isEmailVerified: bool?
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  student_profile_email_unique_idx:
    fields: email
    unique: true
