name: Deploy to Serverpod Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy CampusLoop Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.0'

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      - name: Install dependencies
        run: |
          cd campusloop_server
          dart pub get
          cd ../campusloop_client
          dart pub get

      - name: Deploy to Serverpod Cloud
        env:
          SERVERPOD_CLOUD_PROJECT: "campusloop"
          SERVERPOD_CLOUD_TOKEN: ${{ secrets.SERVERPOD_CLOUD_TOKEN || '01a17e55' }}
        run: |
          cd campusloop_server
          serverpod cloud deploy --project campusloop --token "$SERVERPOD_CLOUD_TOKEN"
