name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'campusloop_flutter/**'
      - 'campusloop_client/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Get client dependencies
        run: |
          cd campusloop_client
          flutter pub get

      - name: Get flutter app dependencies
        run: |
          cd campusloop_flutter
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd campusloop_flutter
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusLoop-Android-APK
          path: campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        run: |
          cp campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.9-apk
          name: "CampusLoop Android App v1.0.9"
          body: |
            ### 📱 CampusLoop Android Release v1.0.9 — Campus Safety, Moderation & Event Broadcasts
            
            Download the official CampusLoop Android APK to your device:
            
            1. Download `CampusLoop.apk` below on your Android device.
            2. Open the downloaded file and select **Install** / **Update**.
            3. Explore all 4 new campus trust, organizer, and moderation features!

            #### 🌟 What's New in v1.0.9:
            1. **🛡️ College Verification & Verified Student Badges**:
               - Verify student affiliation to the same college/institute via domain detection (.edu, .ac.in) or instant 4-digit code.
               - Verified student badge (`🛡️ Verified Campus Student`) displayed across Profile, Study Partner cards, and peer modals.
            2. **🚫 Event Cancellation & Urgent Broadcast Notifications**:
               - Event organizers can update event status and cancel events with reason.
               - Automatically broadcasts high-priority cancellation notices to all students with advice not to travel to the venue.
               - Prominent cancellation badges, warning banners, and notification drawer alerts.
            3. **👑 Organizer-Only Member Skills & Insights Studio**:
               - Confidential organizer dashboard visible ONLY to the creator of a community.
               - View who joined the community, their academic year, department, and specific technical skills & study subjects.
               - Top skill clusters summary to help organizers plan workshops and projects.
            4. **🚨 Safety, Harassment Reporting, Blocking & Community Guidelines**:
               - One-tap harassment and violation reporting generating official `#MOD-2026-XXXX` case numbers.
               - Instant user blocking that hides blocked accounts from partner discovery, community posts, and requests.
               - Profile safety hub to review submitted cases, manage blocked students (with 1-tap unblock), and view Community Guidelines.
          files: |
            campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
            campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
