name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'campusloop_flutter/**'
      - 'campusloop_client/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Get client dependencies
        run: |
          cd campusloop_client
          flutter pub get

      - name: Get flutter app dependencies
        run: |
          cd campusloop_flutter
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd campusloop_flutter
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusLoop-Android-APK
          path: campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        run: |
          cp campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0-apk
          name: "CampusLoop Android App v1.1.0"
          body: |
            ### 📱 CampusLoop Android Release v1.1.0 — Verified Email Auth, Community Access Control & Smart Spam Moderation
            
            Download the official CampusLoop Android APK to your device:
            
            1. Download `CampusLoop.apk` below on your Android device.
            2. Open the downloaded file and select **Install** / **Update**.
            3. Explore all campus features, verified student community, and real-time moderation!

            #### 🌟 What's New in v1.1.0:
            1. **🔒 Verified Gmail Registration & Login**:
               - Cryptographic 6-digit OTP verification for genuine `@gmail.com` accounts.
               - Salted SHA-256 secure hash, 5-minute expiry, and 60-second cooldown timer.
               - Clean account logout and seamless multi-account switching.
            2. **👑 Restricted Community Creation (RBAC)**:
               - Community creation restricted to designated campus administrators on the Serverpod backend.
               - Administrative delegation portal to search users by email, grant/revoke permissions, and review immutable audit logs.
            3. **💬 General Discussion with Smart Moderation**:
               - Default public forum open to all verified students.
               - Automatic keyword moderation with leetspeak normalization, duplicate detection, and academic context tolerance.
          files: |
            campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
            campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
