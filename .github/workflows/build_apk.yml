name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'campusloop_flutter/**'
      - 'campusloop_client/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Get client dependencies
        run: |
          cd campusloop_client
          flutter pub get

      - name: Get flutter app dependencies
        run: |
          cd campusloop_flutter
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd campusloop_flutter
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusLoop-Android-APK
          path: campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        run: |
          cp campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0-apk
          name: "CampusLoop Android App v1.1.0"
          body: |
            ### 📱 CampusLoop Android Release v1.1.0 — Verified Email Auth, Community Access Control & Smart Spam Moderation
            
            Download the official CampusLoop Android APK to your device:
            
            1. Download `CampusLoop.apk` below on your Android device.
            2. Open the downloaded file and select **Install** / **Update**.
            3. Explore all campus features, verified student community, and real-time moderation!

            #### 🌟 What's New in this build:
            1. **📸 Optional & Updatable Profile Picture**:
               - Upload photos from gallery, pick from student avatar presets, or enter custom image URLs with live preview.
               - Interactive camera edit badge on avatar and inside Edit Profile; reversible to initials anytime.
            2. **📅 Event Descriptions in Upcoming Events**:
               - Descriptions now populate home upcoming event cards, eliminating empty vertical gaps.
            3. **📱 Smooth Scroll across Discover, Communities & Updates**:
               - Feature hero banners and creation actions now scroll with the content so cards fill the entire screen.
            4. **💬 Live General Discussion Chat & Author Badges**:
               - Docked chat composer bar and author details (name, branch, year, role & verified shield) across all posts.
            5. **🔒 Clean Multi-Account Switching**:
               - Full session clearing on logout without automatic login redirects.
          files: |
            campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
            campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
