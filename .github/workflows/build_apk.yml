name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'campusloop_flutter/**'
      - 'campusloop_client/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Get client dependencies
        run: |
          cd campusloop_client
          flutter pub get

      - name: Get flutter app dependencies
        run: |
          cd campusloop_flutter
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd campusloop_flutter
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusLoop-Android-APK
          path: campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        run: |
          cp campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2-apk
          name: "CampusLoop Android App v1.0.2"
          body: |
            ### 📱 CampusLoop Android Release v1.0.2
            
            Download the official CampusLoop Android APK to your phone:
            
            1. Download `CampusLoop.apk` below on your Android device.
            2. Open the downloaded file and select **Install** / **Update**.
            3. Enjoy full campus communities, events, and updates powered by Serverpod Cloud!
          files: |
            campusloop_flutter/build/app/outputs/flutter-apk/app-release.apk
            campusloop_flutter/build/app/outputs/flutter-apk/CampusLoop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
